name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f docker-compose.prod.yml build

      - name: Deploy to Swarm
        run: docker stack deploy -c docker-compose.prod.yml taxidriverlab
