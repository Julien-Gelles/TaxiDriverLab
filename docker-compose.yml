services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: taxi-driver-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_SIM_WS_URL: ws://localhost:8000/ws
    image: taxi-driver-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
